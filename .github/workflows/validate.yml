name: Validate

on:
  push:
  pull_request:
  schedule:
    # Weekly, so we hear about Home Assistant changes that break things.
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      # The HACS validator only works on public repositories (and HACS can
      # only install public repositories), so skip it while this one is private.
      - name: Check repository visibility
        id: visibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "private=$(gh api repos/${{ github.repository }} --jq .private)" >> "$GITHUB_OUTPUT"
      - if: steps.visibility.outputs.private == 'false'
        uses: hacs/action@main
        with:
          category: integration
          # Brand icons and GitHub topics are only needed for the default HACS store.
          ignore: brands topics
      - if: steps.visibility.outputs.private != 'false'
        run: echo "::notice::Repository is private; skipped HACS validation."

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements_test.txt ruff
      - run: ruff check custom_components tests
      - run: pytest -q
